name: CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1.18.0
        with:
          working-directory: worker
          node-version-file: ".node-version"
          cache: true
          run-install: false

      - name: Install Dependencies
        run: vp install

      - name: Generate Worker Types
        run: vp run wrangler:types

      - name: Lint
        run: vp check

      - name: Build
        run: vp run build
